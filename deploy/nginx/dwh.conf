# I16: /etc/nginx/sites-available/dwh.conf - the only way into DWH: HTTPS on 443.
# Frontend: the built files of the current release; /api: the API on 127.0.0.1:8000.
# Replace dwh.example.local with the DNS name of the server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dwh.example.local;

    ssl_certificate     /etc/dwh/tls/dwh.crt;
    ssl_certificate_key /etc/dwh/tls/dwh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 20m;

    root /opt/dwh/current/src/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    # No add_header inside the locations: it would drop the security headers above.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

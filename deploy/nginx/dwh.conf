# I16: /etc/nginx/sites-available/dwh.conf - the only way into DWH: HTTPS on 443.
# Frontend: the built files of the current release; /api: the API on 127.0.0.1:8000.
# server_name and the redirect below carry the DNS name of the server (I13-10: tools/server/dwh_tls.py sets it).

# I13-10 (T3): any other name or the bare address (https://10.1.20.20) is redirected to the DNS name.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/dwh/tls/dwh.crt;
    ssl_certificate_key /etc/dwh/tls/dwh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://dwh.example.local$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dwh.example.local;

    ssl_certificate     /etc/dwh/tls/dwh.crt;
    ssl_certificate_key /etc/dwh/tls/dwh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 20m;

    root /opt/dwh/current/src/frontend/dist;
    index index.html;

    # I11-05: optional extra locations (test API service), see tools/server/dwh_test_api_setup.py
    include /etc/dwh/nginx-dwh.d/*.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    # No add_header inside the locations: it would drop the security headers above.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

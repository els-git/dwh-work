# I11-05: test API service (only for testing the API connector); included into the DWH server block
# from /etc/dwh/nginx-dwh.d/ by tools/server/dwh_test_api_setup.py.
location /pv-api/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /pv-api;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}

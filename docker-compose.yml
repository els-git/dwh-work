services:

  postgres:
    image: postgres:17
    container_name: dwh-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DWH_DB_NAME}
      POSTGRES_USER: ${DWH_DB_ADMIN}
      POSTGRES_PASSWORD: ${DWH_DB_PASSWORD}

    ports:
      - "127.0.0.1:${DWH_DB_PORT}:5432"

    volumes:
      - dwh_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - dwh-network


volumes:

  dwh_pgdata:
    name: dwh_pgdata


networks:

  dwh-network:
    name: dwh-network
